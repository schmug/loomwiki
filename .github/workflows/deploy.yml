# SPDX-License-Identifier: Apache-2.0
#
# Continuous deployment — runs on every push to main.
#
# Replaces the old "blind 120s sleep against a non-existent auto-deploy"
# post-deploy.yml (issue #78): there is now a REAL deploy job, and the
# live smoke is gated to run only AFTER that deploy succeeds.
#
# Jobs:
#   1. deploy-api  — applies D1 migrations forward-only, then deploys the
#                     API Worker (loomwiki-api) via `wrangler deploy`.
#                     On by default.
#   2. deploy-web  — deploys the web Worker (loomwiki-web). GATED OFF by
#                     default behind the WEB_CD_ENABLED repo variable
#                     until the operator has done the one-time
#                     Pages -> Worker production cutover (see DEPLOY.md
#                     "One-time production cutover: Pages project -> Worker").
#   3. smoke       — the post-deploy live verifier. `needs: deploy-api`,
#                     so it runs only after a successful real deploy and
#                     its `.data.commit == <merged SHA>` assertion can
#                     finally pass. Preserves the #74 CF Access
#                     secret-guard and the issue de-dupe verbatim.
#
# Required repository secrets (Settings -> Secrets and variables ->
# Actions -> Secrets):
#   - CLOUDFLARE_API_TOKEN     Cloudflare API token with Workers Scripts
#                              Edit + D1 Edit (never echoed by this file).
#   - CLOUDFLARE_ACCOUNT_ID    Cloudflare account id (wrangler target).
#   - CF_ACCESS_CLIENT_ID      Access service-token client id (smoke).
#   - CF_ACCESS_CLIENT_SECRET  Access service-token client secret (smoke).
#
# Required repository variable (Settings -> Secrets and variables ->
# Actions -> Variables):
#   - WEB_CD_ENABLED           "true" enables the web Worker CD job.
#                              Leave UNSET / "false" until the one-time
#                              Pages -> Worker cutover is done.
#
# No prod creds in this file: wrangler reads CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID from the step env. They are never interpolated
# into a `run:` argument string.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy per ref; never cancel a deploy mid-flight (a
# half-applied migration or partial `wrangler deploy` is worse than
# waiting for the prior run to finish).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-api:
    name: deploy loomwiki-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json#packageManager — the single
      # source of truth. (Setup block kept in lockstep with ci.yml#verify.)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # D1 migrations are forward-only (CLAUDE.md). `migrate:remote` runs
      # `wrangler d1 migrations apply` against the production DB; it is
      # idempotent (already-applied migrations are no-ops). This mirrors
      # the documented deploy order in DEPLOY.md §8 — `deploy:worker`
      # itself only runs `wrangler deploy`, so migrations are an explicit
      # prior step here (NOT folded into the worker `deploy` script —
      # that would change the local/manual contract).
      - name: Apply D1 migrations (forward-only)
        run: pnpm migrate:remote

      # `pnpm deploy:worker` is just `wrangler deploy` (no tag). The
      # /api/health endpoint reports CF_VERSION_METADATA.tag and the
      # smoke job asserts it equals the deployed git SHA (see #65 /
      # commit 792cfa7 and apps/worker/src/routes/health.ts). Without
      # --tag, .tag is empty and health falls back to the deployment
      # UUID (.id), which never equals github.sha → smoke fails forever.
      # So CI deploys with --tag set to the commit SHA. github.sha is a
      # trusted runner-provided value (a 40-char hex SHA, not
      # attacker-controlled event text); passed via env + quoted per
      # the workflow-injection-safe pattern. The manual `deploy:worker`
      # script is intentionally left untouched (operator contract).
      - name: Deploy API Worker (loomwiki-api, tagged with git SHA)
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: pnpm --filter @loomwiki/worker exec wrangler deploy --config ../../wrangler.jsonc --tag "$DEPLOY_SHA"

  deploy-web:
    name: deploy loomwiki-web (gated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GATED OFF by default. The web app deploys as a Worker post-#76, but
    # an existing deploy must complete the one-time Pages -> Worker
    # cutover BEFORE the first automated `wrangler deploy` of loomwiki-web
    # (otherwise the deploy collides on the name / the live site breaks).
    # See DEPLOY.md "One-time production cutover: Pages project -> Worker".
    # Flip the WEB_CD_ENABLED repo variable to "true" only after that.
    if: vars.WEB_CD_ENABLED == 'true'
    # Deploy order matters: the web Worker's `API` service binding
    # resolves against loomwiki-api at deploy time, so API ships first.
    needs: deploy-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `deploy:web` runs `astro build && wrangler deploy` from apps/web.
      - name: Deploy Web Worker (loomwiki-web)
        run: pnpm deploy:web

  # Post-deploy live verifier. Runs AFTER a successful API deploy (no more
  # blind 120s sleep against a non-deploy — issue #78). Asserts:
  #   1. /api/health is OK, fast (<5s), and reports the SHA we just shipped.
  #   2. Security headers are present on the front door (CSP, X-Frame-Options).
  #   3. /api/me returns 200 + { user, workspace } when service-token auth is used.
  # On any failure, files/append to a single GitHub issue (de-duped).
  #
  # CF Access service-token secrets (provisioned via Cloudflare Zero Trust
  # -> Access -> Service Auth) are required for the smoke to get past the
  # Access login page. The #74 guard skips (does not fail) when they are
  # unset — a missing operator secret is not a deploy failure.
  smoke:
    name: live smoke (loomwiki.cortech.online)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-api
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: https://loomwiki.cortech.online
      EXPECTED_SHA: ${{ github.sha }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      # Guard: the live smoke needs CF Access service-token secrets to get
      # past the Access login page. When they are unset the curl receives the
      # Access HTML challenge instead of JSON and every step fails, which used
      # to file a duplicate noise issue on every merge to main. If either
      # secret is empty, emit an actionable message and skip the smoke (the
      # job still succeeds — a missing operator secret is not a deploy
      # failure). Subsequent steps gate on steps.guard.outputs.skip.
      - name: Guard on CF Access secrets
        id: guard
        run: |
          set -euo pipefail
          if [ -z "${CF_ACCESS_CLIENT_ID}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::post-deploy smoke skipped: CF Access service-token secrets not configured — set CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET in repo settings (Cloudflare Zero Trust -> Access -> Service Auth)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Short propagation buffer. The deploy-api job has already completed
      # (needs: deploy-api), so the new code IS live — this is only a small
      # cushion for edge cache/route propagation, not the old blind
      # 120s-sleep-against-nothing.
      - name: Wait for deploy to propagate
        if: steps.guard.outputs.skip != 'true'
        run: sleep 15

      - name: Verify /api/health (commit + ok flag)
        id: health
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --max-time 5 \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${BASE_URL}/api/health")
          echo "$BODY" | jq -e '.ok == true' > /dev/null
          # /api/health returns ApiResult: { ok: true, data: { commit, version, status } }
          echo "$BODY" | jq -e --arg sha "$EXPECTED_SHA" '.data.commit == $sha' > /dev/null

      - name: Verify security headers (CSP, X-Frame-Options)
        id: headers
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          HEADERS=$(curl -fsSI --max-time 10 "${BASE_URL}/")
          echo "$HEADERS" | grep -i '^Content-Security-Policy:' > /dev/null
          echo "$HEADERS" | grep -i '^X-Frame-Options:[[:space:]]*DENY' > /dev/null

      - name: Verify /api/me (authenticated)
        id: me
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --max-time 5 \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "${BASE_URL}/api/me")
          echo "$BODY" | jq -e '.data.user' > /dev/null
          echo "$BODY" | jq -e '.data.workspace' > /dev/null

      - name: File issue on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const { RUN_URL, OWNER, SHA } = process.env;
            const title = `[post-deploy] Verifier failed for ${SHA}`;
            const body = [
              `Post-deploy verifier for commit \`${SHA}\` failed.`,
              ``,
              `**Run:** ${RUN_URL}`,
              ``,
              `Steps in \`.github/workflows/deploy.yml\` (smoke job):`,
              `- /api/health (200 + ok:true + matching commit, <5s)`,
              `- Security headers (Content-Security-Policy, X-Frame-Options: DENY)`,
              `- /api/me (200 + JSON with user + workspace fields)`,
              ``,
              `Inspect the run logs above to identify which step failed.`,
              ``,
              `_Filed automatically by the deploy workflow._`,
            ].join("\n");
            // De-dupe: a genuine smoke failure tends to recur on every merge
            // until fixed. Rather than open a fresh issue each run, reuse the
            // existing open post-deploy/automated issue and append a comment.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "post-deploy,automated",
              per_page: 1,
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Post-deploy verifier failed again for commit \`${SHA}\`.\n\n**Run:** ${RUN_URL}\n\n_Appended automatically; the original report is above._`,
              });
              core.notice(`Post-deploy failure recorded on existing issue #${issue.number} (de-duped).`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [OWNER],
                labels: ["post-deploy", "automated"],
              });
            }
