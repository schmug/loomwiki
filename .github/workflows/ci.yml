# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json#packageManager — the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # M8 release-readiness guards — catch the categories of footguns
      # that bit the cortech.online dogfood deploy in PR #24.
      - name: Lint wrangler.jsonc
        run: pnpm exec tsx scripts/lint-wrangler.ts

      - name: Lint deploy scripts
        run: pnpm exec tsx scripts/lint-deploy-scripts.ts

      - name: Lint wrangler devDep
        run: pnpm exec tsx scripts/lint-wrangler-devdep.ts
